<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Materialverwaltung</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
    <img src="img/logo.png" alt="THW Logo">
    <br>
    <h1>Förderverein THW Steinau</h1>
</header>

<h1>Materialverwaltung</h1>

<!-- =========================
     FORMULAR
========================= -->
<h2>Materialtyp anlegen</h2>

<form id="materialForm">

    <label>Kategorie</label>
    <select id="category"></select>

    <button type="button" id="newCategoryBtn">
        + Kategorie
    </button>

    <br><br>

    <label>Name</label>
    <input type="text" id="name" placeholder="z.B. CEE Verlängerung">

    <label>Spezifikation</label>
    <input type="text" id="specification" placeholder="z.B. 32A 10m">

    <br><br>

    <button type="submit">Speichern</button>
    <button type="reset">Zurücksetzen</button>

    <button type="button" onclick="window.location.href='products.html'">
        Zurück
    </button>

</form>

<p id="result"></p>

<hr>

<!-- =========================
     DESKTOP TABELLE
========================= -->
<h2>Materialtypen (Desktop)</h2>

<table id="materialTable">
    <thead>
        <tr>
            <th>Kategorie</th>
            <th>Name</th>
            <th>Spezifikation</th>
            <th>Aktionen</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<hr>


<div id="materialCardContainer" class="card-container"></div>
<hr>

<!-- =========================
     KATEGORIEN
========================= -->
<h2>Kategorien</h2>

<table id="categoryTable">
    <thead>
        <tr>
            <th>Name</th>
            <th>Aktionen</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<!-- =========================
     DIALOG
========================= -->
<dialog id="categoryDialog">

    <h3>Neue Kategorie</h3>

    <label>Name</label>
    <input type="text" id="newCategoryName">

    <br><br>

    <button id="saveCategoryBtn">Speichern</button>
    <button id="closeDialogBtn">Abbrechen</button>

</dialog>

<script src="js/material.js"></script>

</body>
</html>
