
<main>
<h2>Verteilerplanung</h2>

<!-- Veranstaltung bleibt immer sichtbar -->
<div class="filter-container">

    <div class="form-group">
        <label for="event_id">Veranstaltung:</label>
        <select id="event_id">
            <option value="">Bitte auswählen</option>
        </select>
    </div>

</div>


<!-- Alles ab hier erst sichtbar, wenn Veranstaltung ausgewählt -->
<div id="distributionContent">

    <h2>Planung auswählen</h2>

    <div class="filter-container">

        <div class="form-group">
            <label for="categoryFilter">Kategorie:</label>
            <select id="categoryFilter">
                <option value="">Alle</option>
            </select>
        </div>

        <div class="form-group">
            <label for="distributionFilter">Anzeige:</label>
            <select id="distributionFilter">
                <option value="all">Alle</option>
                <option value="planned">Nur eingeplante</option>
                <option value="unplanned">Nur nicht eingeplante</option>
            </select>
        </div>

    </div>


    <!-- Desktop -->
    <div class="desktop-only">

        <table>
            <thead>
                <tr>
                    <th rowspan="2">Einsatz</th>
                    <th rowspan="2">Produkt</th>

                    <th colspan="2">Input</th>

                    <th colspan="5">Output</th>

                    <th rowspan="2">Ort</th>
                </tr>

                <tr>
                    <th>Eingang</th>
                    <th>Kabel</th>

                    <th class="output-col">Schuko</th>
                    <th class="output-col">CEE16</th>
                    <th class="output-col">CEE32</th>
                    <th class="output-col">CEE63</th>
                    <th class="output-col">CEE125</th>
                </tr>
            </thead>

            <tbody id="plan_table"></tbody>
        </table>

    </div>


    <!-- Mobile -->
    <div id="distributionCards" class="mobile-only"></div>


    <br>

    <button
        id="saveButton"
        type="button"
        aria-label="Speichern"
        title="Speichern">
        <i class="fa-solid fa-floppy-disk"></i>
    </button>

    <button
        id="transferButton"
        type="button">
        In Materialplanung übernehmen
    </button>

    <p id="result"></p>

</div>


</main>

<!-- Bild-Modal -->

<div id="imageModal" class="modal hidden">


<div class="modal-content">

    <h2>Verteiler Bilder</h2>

    <div id="imageGallery"></div>

    <div id="imageCounter"></div>

    <div class="image-navigation">

        <button
            type="button"
            onclick="previousImage()">
            ◀
        </button>

        <button
            type="button"
            onclick="nextImage()">
            ▶
        </button>

    </div>

    <button
        type="button"
        onclick="closeImageModal()">
        Schließen
    </button>

</div>


</div>
