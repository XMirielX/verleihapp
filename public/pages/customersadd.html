<div class="page">
  <div class="page-header">
    <h1>Kunden</h1>
  </div>

  <!-- ================================================
         KUNDE ANLEGEN / BEARBEITEN
    ================================================= -->

  <div class="card">
    <div class="card-header">
      <h2 id="customerFormTitle">Kunde anlegen</h2>
    </div>

    <div class="card-body">
      <div class="form-grid">
        <div class="form-group">
          <label for="customerName"> Name * </label>

          <input type="text" id="customerName" required />
        </div>

        <div class="form-group">
          <label for="customerStreet"> Straße </label>

          <input type="text" id="customerStreet" />
        </div>

        <div class="form-group">
          <label for="customerPlz"> PLZ </label>

          <input type="text" id="customerPlz" />
        </div>

        <div class="form-group">
          <label for="customerCity"> Ort </label>

          <input type="text" id="customerCity" />
        </div>

        <div class="form-group">
          <label for="customerEmail"> E-Mail </label>

          <input type="email" id="customerEmail" />
        </div>

        <div class="form-group">
          <label for="customerPhone"> Telefon </label>

          <input type="text" id="customerPhone" />
        </div>

        <div class="form-group">
          <label for="customerPriceCategory"> Preisklasse </label>

          <select id="customerPriceCategory">
            <option value="">Bitte auswählen</option>
          </select>
        </div>
        <div class="form-group checkbox-group">
          <label>
            <input type="checkbox" id="customerStat" checked />

            Aktiv
          </label>
        </div>
        <div class="form-group checkbox-group">
          <label>
            <input type="checkbox" id="customerKnzPrivat" />

            Privatkunde
          </label>
        </div>
      </div>

      <div class="card-actions">
        <button
          type="button"
          class="btn btn-primary"
          id="customerSaveButton"
          onclick="saveCustomer()"
          aria-label="Speichern"
          title="Speichern"
        ><i class="fa-solid fa-floppy-disk"></i>Speichern</button>

        <button type="button" class="btn" onclick="resetCustomerForm()">
          <i class="fa-solid fa-xmark"></i> Abbrechen
        </button>
      </div>
    </div>
  </div>
</div>
