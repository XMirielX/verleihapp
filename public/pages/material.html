<div class="page-header">
  <h1>Produktgruppen</h1>
</div>

<h2 id="formTitle">Produktgruppe anlegen</h2>

<form id="materialForm">
  <div class="form-grid">
    <div class="form-group">
      <label for="category">Kategorie</label>
      <select id="category"></select>
      <button type="button" id="newCategoryBtn" class="btn-secondary">+ Kategorie</button>
    </div>
    <div class="form-group">
      <label for="name">Name</label>
      <input type="text" id="name" placeholder="z.B. CEE Verlängerung" />
    </div>
    <div class="form-group">
      <label for="specification">Spezifikation</label>
      <input type="text" id="specification" placeholder="z.B. CEE 32A" />
    </div>
  </div>

  <div class="form-actions">

  <button
    type="submit"
    id="saveButton"
    aria-label="Speichern"
    title="Speichern"
  >
    <i class="fa-solid fa-floppy-disk"></i> Speichern
  </button>

  <button type="button" id="cancelButton" class="btn-secondary" onclick="clearMaterialForm()" hidden>
    <i class="fa-solid fa-xmark"></i> Abbrechen
  </button>
  </div>
</form>

<p id="result"></p>

<hr />

<!-- =========================
     MATERIALTYPEN
========================= -->

<h2>Produktgruppen</h2>

<!-- DESKTOP -->

<div class="desktop-only">
  <table id="materialTable">
    <thead>
      <tr>
        <th>Kategorie</th>
        <th>Name</th>
        <th>Spezifikation</th>
        <th>Aktionen</th>
      </tr>
    </thead>

    <tbody></tbody>
  </table>
</div>

<!-- MOBILE -->

<div id="materialCardContainer" class="card-container mobile-only"></div>

<hr />

<!-- =========================
     KATEGORIEN
========================= -->

<h2>Kategorien</h2>

<!-- DESKTOP -->

<div class="desktop-only">
  <table id="categoryTable">
    <thead>
      <tr>
        <th>Name</th>
        <th>Aktionen</th>
      </tr>
    </thead>

    <tbody></tbody>
  </table>
</div>

<!-- MOBILE -->

<div id="categoryCardContainer" class="card-container mobile-only"></div>

<hr />

<!-- =========================
     KATEGORIE DIALOG
========================= -->

<dialog id="categoryDialog">
  <h2>Neue Kategorie</h2>

  <label for="newCategoryName"> Name </label>

  <input type="text" id="newCategoryName" />

  <br /><br />

  <div class="dialog-actions form-actions">
    <button
      type="button"
      id="saveCategoryBtn"
      aria-label="Speichern"
      title="Speichern"
    >
      <i class="fa-solid fa-floppy-disk"></i> Speichern
    </button>

    <button type="button" class="btn-secondary" id="closeDialogBtn">
      <i class="fa-solid fa-xmark"></i> Abbrechen
    </button>
  </div>
</dialog>

<!-- =========================
     MATERIALPREISE DIALOG
========================= -->

<dialog id="priceDialog">
  <h2 id="priceDialogTitle">Produktpreise</h2>

  <div id="materialPriceContainer">
    <!-- Preise werden per JavaScript geladen -->
  </div>

  <br />

  <div class="dialog-actions form-actions">
    <button
      type="button"
      id="saveMaterialPricesBtn"
      aria-label="Speichern"
      title="Speichern"
    >
      <i class="fa-solid fa-floppy-disk"></i> Speichern
    </button>

    <button type="button" class="btn-secondary" id="closePriceDialogBtn">
      <i class="fa-solid fa-xmark"></i> Abbrechen
    </button>
  </div>
</dialog>
