<div class="page">
  <div class="page-header">
    <h1>Veranstaltung anlegen</h1>
  </div>

  <!-- ================================================
       VERANSTALTUNG ANLEGEN
  ================================================= -->

  <div class="card">


    <div class="card-body">
      <form id="eventForm">

        <input type="hidden" id="stat" value="10" />

        <div class="form-grid">

          <div class="form-group">
            <label for="name">
              Name *
            </label>

            <input
              type="text"
              id="name"
              required
            />
          </div>

          <div class="form-group">
            <label for="customer_id">
              Kunde
            </label>

            <select id="customer_id">
              <option value="">Kein Kunde</option>
            </select>
          </div>

          <div class="form-group">
            <label for="start">
              Beginn
            </label>

            <input
              type="date"
              id="start"
            />
          </div>

          <div class="form-group">
            <label for="ende">
              Ende
            </label>

            <input
              type="date"
              id="ende"
            />
          </div>

        </div>

        <div class="card-actions">

          <button
            type="submit"
            class="btn btn-primary"
            aria-label="Speichern"
            title="Speichern"
          >
            <i class="fa-solid fa-floppy-disk"></i>
            Speichern
          </button>

          <button
            type="button"
            class="btn"
            onclick="resetEventForm()"
            aria-label="Abbrechen"
            title="Abbrechen"
          >
            <i class="fa-solid fa-xmark"></i>
            Abbrechen
          </button>

        </div>

      </form>
    </div>
  </div>

  <p id="result"></p>
</div>
