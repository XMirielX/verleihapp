<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passwort ändern</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <img src="img/logo.png" alt="THW Logo" style="height:50px;">
        <p class="auth-brand">Förderverein THW Steinau</p>
    </header>

    <div class="page-header"><h1>Passwort ändern</h1></div>
    <p>Bitte gib ein neues Passwort ein.</p>

    <form id="passwordChangeForm">
    <div class="form-grid">
    <div class="form-group">
        <label for="newPassword">Neues Passwort:</label>
        <input type="password" id="newPassword">
    </div>
    <div class="form-group">
        <label for="confirmPassword">Passwort bestätigen:</label>
        <input type="password" id="confirmPassword">
    </div>

    </div>
    <div class="form-actions"><button id="changePasswordButton" type="submit">Passwort ändern</button></div>
    </form>
    <p id="changeResult"></p>

    <script src="js/notifications.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
