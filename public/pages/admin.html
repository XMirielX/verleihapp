

<div class="page-header">
    <h1>Benutzerverwaltung</h1>
</div>

    <!-- Neuer Benutzer -->
    <h2>Neuen Benutzer erstellen</h2>
    <form id="userCreateForm">
    <div class="form-grid">
    <div class="form-group">
        <label for="newUsername">Benutzername:</label>
        <input type="text" id="newUsername">
    </div>
    <div class="form-group">
        <label for="newRole">Rolle:</label>
        <select id="newRole">
            <option value="user">User</option>
            <option value="admin">Admin</option>
            <option value="lese">Lesen</option>

        </select>
    </div>
    </div>
    <div class="form-actions"><button id="createUserButton" type="submit"><i class="fa-solid fa-floppy-disk"></i> Speichern</button></div>
    </form>
    <p id="createUserResult"></p>

    <button type="button" class="btn-secondary" onclick="loadPage('home')">Zurück</button>

    <!-- Bestehende Benutzer -->
    <h2>Bestehende Benutzer</h2>

    <!-- Desktop-Tabelle -->
    <div id="desktopTableContainer" class="desktop-only">

    <table id="userTable">
            <thead>
                <tr>
                    <th>Benutzername</th>
                    <th>Rolle</th>
                    <th>Aktionen</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <!-- Mobile Cards -->
    <div id="userCardContainer" class="card-container mobile-only"></div>
