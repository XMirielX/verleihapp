<h1>Stornieren</h1>

<h2>Event auswählen</h2>

<select id="eventSelect"></select>


<h2>Barcode scannen / eingeben</h2>

<div class="form-group">
    <input 
        type="text" 
        id="barcodeInput" 
        placeholder="Barcode scannen..."
    >

    <button id="scanBtn">
        Kamera
    </button>
</div>


<div 
    id="cameraContainer" 
    class="camera-container">
</div>


<button id="stornorentButton">
    Stornieren
</button>



<div class="desktop-only">

    <h2>Materialübersicht</h2>

    <table id="rentalTable">

        <thead>
            <tr>
                <th>Material</th>
                <th>Spezifikation</th>
                <th>Vorhanden</th>
                <th>Geplant</th>
                <th>Ausgeliehen</th>
            </tr>
        </thead>

        <tbody></tbody>

    </table>

</div>


<div id="rentalCardContainer" class="card-container mobile-only"></div>


<p id="result"></p>
