<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distribution Planung</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
    <img src="img/logo.png" alt="THW Logo">
    <h1>Verteilerplanung</h1>
</header>
    <button type="button" onclick="window.location.href='rentals.html'">
        Zurück
    </button>
<main>
    <h2>Planung auswählen</h2>

    <label for="event_id">Veranstaltung:</label>
    <select id="event_id" onchange="loadPlan()">
        <option value="">Bitte auswählen</option>
    </select>

    <label for="categoryFilter">Kategorie:</label>
    <select id="categoryFilter">
        <option value="">Alle</option>
    </select>

    <label for="distributionFilter">Anzeige:</label>
    <select id="distributionFilter">
        <option value="all">Alle</option>
        <option value="planned">Nur eingeplante</option>
        <option value="unplanned">Nur nicht eingeplante</option>
    </select>


</section>


    <h2>Verteilerplanung</h2>
<div id="planningTableContainer"></div>
<table class="desktop-only">    <thead>
        <tr>
            <th rowspan="2">Einsatz</th>
            <th rowspan="2">Produkt</th>
            <th colspan="2">Input</th>
            <th colspan="5">Output</th>
            <th rowspan="2">Ort</th>
        </tr>
        <tr>
            <th>Eingang</th>
            <th>Kabel</th>
<th class="output-col">Schuko</th>
<th class="output-col">CEE16</th>
<th class="output-col">CEE32</th>
<th class="output-col">CEE63</th>
<th class="output-col">CEE125</th>
        </tr>
    </thead>

    <tbody id="plan_table">
    </tbody>
</table>

<div id="distributionCards"></div>
    <br>

<button id="saveButton" onclick="savePlan()">Speichern</button>

<button id="transferButton"
onclick="transferToMaterialPlan()">
In Materialplanung übernehmen
</button>

</main>

<div id="imageModal" class="modal hidden">

    <div class="modal-content">

        <h2>Verteiler Bilder</h2>

        <div id="imageGallery"></div>

        <div id="imageCounter"></div>

        <div class="image-navigation">

            <button onclick="previousImage()">◀</button>

            <button onclick="nextImage()">▶</button>

        </div>

        <button onclick="closeImageModal()">
            Schließen
        </button>

    </div>

</div>

<script src="js/distribution_image.js"></script>
<script src="js/distributions_plan.js"></script>

</body>
</html>
