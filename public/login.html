<!DOCTYPE html>
<html lang="de">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Login THW System</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header>
        <img src="img/logo.png" alt="THW Logo">
        <br>
        <p class="auth-brand">Förderverein THW Steinau</p>
    </header>
    <div class="page-header"><h1>Login</h1></div>

    <form id="loginForm">
    <div class="form-grid">
    <div class="form-group">
        <label for="username">Benutzername:</label>
        <input type="text" id="username">
    </div>

    <div class="form-group">
        <label for="password">Passwort:</label>
        <input type="password" id="password">
    </div>

    </div>
    <div class="form-actions"><button id="loginButton" type="submit">Einloggen</button></div>
    </form>
    <p id="loginResult"></p>

    <script src="js/notifications.js"></script>
    <script src="js/main.js"></script>


</body>

</html>
